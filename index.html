<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agri Smart System</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon192.png">
<link rel="apple-touch-icon" href="icon512.png">
<meta name="theme-color" content="#07111f">

<script>
if ('serviceWorker' in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: linear-gradient(160deg,#020617,#07111f,#052e16);
  overflow-x: hidden;
}

.card {
  backdrop-filter: blur(15px);
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.1);
  box-shadow: 0 0 25px rgba(0,255,140,.08);
}

.glow {
  animation: glow 2s infinite;
}

@keyframes glow {
  0% { opacity: .6; }
  50% { opacity: 1; }
  100% { opacity: .6; }
}

.bar {
  transition: all .8s ease;
}
</style>

</head>

<body class="text-white min-h-screen p-5 font-sans">

<div class="max-w-md mx-auto space-y-5">

<!-- LOGO -->
<div class="text-center space-y-2">
  <div class="text-6xl glow">🌱</div>
  <h1 class="text-3xl font-bold text-emerald-400">AGRI SMART SYSTEM</h1>
  <p class="text-sm text-slate-300">ESP32 IoT Monitor</p>
  
  <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-emerald-500/20">
    <div class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></div>
    <span id="espStatusBadge">ONLINE</span>
  </div>
</div>

<!-- ESTADO DE LA PLANTA -->
<div class="card rounded-3xl p-5 text-center">
  <p class="text-slate-400 text-sm">ESTADO DE LA PLANTA</p>
  <div id="plantEmoji" class="text-6xl mt-3">🌱</div>
  <h2 id="plantState" class="text-2xl font-bold text-emerald-400 mt-3">ESPERANDO DATOS...</h2>
  <p id="soilText" class="text-slate-300 mt-2">Conectando con el sistema.</p>
</div>

<!-- HUMEDAD DEL SUELO -->
<div class="card rounded-3xl p-5">
  <div class="flex justify-between">
    <h2 class="font-bold">HUMEDAD DEL SUELO</h2>
    <span id="soilValue" class="text-3xl font-bold text-blue-400">0%</span>
  </div>
  <div class="w-full bg-slate-800 rounded-full h-4 mt-4">
    <div id="soilBar" class="bar h-4 rounded-full bg-blue-500" style="width:0%;"></div>
  </div>
</div>

<!-- TEMPERATURA -->
<div class="card rounded-3xl p-5 text-center">
  <p class="text-slate-400">TEMPERATURA</p>
  <h2 id="tempValue" class="text-5xl font-bold text-orange-400 mt-2">0°C</h2>
</div>

<!-- HUMEDAD AMBIENTE -->
<div class="card rounded-3xl p-5 text-center">
  <p class="text-slate-400">HUMEDAD AMBIENTE</p>
  <h2 id="humValue" class="text-5xl font-bold text-cyan-400 mt-2">0%</h2>
</div>

<!-- BOMBA -->
<div class="card rounded-3xl p-5">
  <div class="flex justify-between">
    <h2 class="font-bold">BOMBA DE AGUA</h2>
    <span id="pumpStatus" class="text-emerald-400 font-bold">APAGADA</span>
  </div>
  <button id="pumpBtn" onclick="togglePump()" class="w-full mt-5 py-4 rounded-2xl bg-blue-600 hover:bg-blue-500 font-bold transition-all">
    ACTIVAR RIEGO
  </button>
</div>

<!-- MODO DE RIEGO -->
<div class="card rounded-3xl p-5">
  <div class="flex justify-between">
    <h2 class="font-bold">MODO DE RIEGO</h2>
    <span id="modeStatus" class="text-emerald-400 font-bold">AUTOMÁTICO</span>
  </div>
  <button id="modeBtn" onclick="toggleMode()" class="w-full mt-5 py-4 rounded-2xl bg-emerald-600 hover:bg-emerald-500 font-bold transition-all">
    CAMBIAR A MANUAL
  </button>
</div>

<!-- ESTADÍSTICAS SISTEMA -->
<div class="card rounded-3xl p-5">
  <div class="flex justify-between mt-2">
    <span>ÚLTIMA ACTUALIZACIÓN</span>
    <span id="clock" class="text-emerald-400">00:00:00</span>
  </div>
</div>

</div>

<script>
let automatico = true;
const ESP32_IP = "http://192.168.1.16"; // Asegúrate de que esta sea la IP correcta de tu ESP32

// Control de la bomba
async function togglePump(){
  const statusText = document.getElementById("pumpStatus").innerText;
  const endpoint = (statusText === "ENCENDIDA") ? "/bomba/off" : "/bomba/on";
  
  try {
    await fetch(ESP32_IP + endpoint);
    setTimeout(leerESP32, 500); // Refresca rápido para mostrar el cambio
  } catch(error) {
    console.log("Error bomba:", error);
  }
}

// Control del modo Auto/Manual
async function toggleMode(){
  const endpoint = automatico ? "/modo/manual" : "/modo/auto";
  
  try {
    await fetch(ESP32_IP + endpoint);
    setTimeout(leerESP32, 500);
  } catch(error) {
    console.log("Error modo:", error);
  }
}

// Pintar los datos en el HTML
function updateDashboard(soil, temp, hum, bomba, modo) {
  // 1. Valores principales
  document.getElementById("soilValue").innerText = (soil ?? 0) + "%";
  document.getElementById("tempValue").innerText = (temp ?? 0) + "°C";
  document.getElementById("humValue").innerText = (hum ?? 0) + "%";
  document.getElementById("soilBar").style.width = Math.min(Math.max(soil ?? 0, 0), 100) + "%";

  // 2. Estado visual de la planta según la humedad del suelo
  const emoji = document.getElementById("plantEmoji");
  const state = document.getElementById("plantState");
  const text = document.getElementById("soilText");

  if(soil < 30) {
    emoji.innerText = "🥀";
    state.innerText = "SUELO SECO";
    state.className = "text-2xl font-bold text-red-400 mt-3";
    text.innerText = "Necesita agua urgentemente.";
  } else if(soil < 70) {
    emoji.innerText = "🌱";
    state.innerText = "HUMEDAD NORMAL";
    state.className = "text-2xl font-bold text-emerald-400 mt-3";
    text.innerText = "La planta se encuentra saludable.";
  } else {
    emoji.innerText = "🌳";
    state.innerText = "HUMEDAD ÓPTIMA";
    state.className = "text-2xl font-bold text-cyan-400 mt-3";
    text.innerText = "Excelente nivel de humedad.";
  }

  // 3. UI de la Bomba
  const status = document.getElementById("pumpStatus");
  const btn = document.getElementById("pumpBtn");
  if(bomba === "ENCENDIDA"){
    status.innerText = "ENCENDIDA";
    status.className = "text-red-400 font-bold";
    btn.innerText = "DETENER RIEGO";
    btn.className = "w-full mt-5 py-4 rounded-2xl bg-red-600 hover:bg-red-500 font-bold transition-all";
  } else {
    status.innerText = "APAGADA";
    status.className = "text-emerald-400 font-bold";
    btn.innerText = "ACTIVAR RIEGO";
    btn.className = "w-full mt-5 py-4 rounded-2xl bg-blue-600 hover:bg-blue-500 font-bold transition-all";
  }

  // 4. UI del Modo
  const modeStatus = document.getElementById("modeStatus");
  const modeBtn = document.getElementById("modeBtn");
  if(modo === "AUTOMATICO"){
    automatico = true;
    modeStatus.innerText = "AUTOMÁTICO";
    modeStatus.className = "text-emerald-400 font-bold";
    modeBtn.innerText = "CAMBIAR A MANUAL";
    modeBtn.className = "w-full mt-5 py-4 rounded-2xl bg-emerald-600 hover:bg-emerald-500 font-bold transition-all";
  } else {
    automatico = false;
    modeStatus.innerText = "MANUAL";
    modeStatus.className = "text-yellow-400 font-bold";
    modeBtn.innerText = "CAMBIAR A AUTOMÁTICO";
    modeBtn.className = "w-full mt-5 py-4 rounded-2xl bg-yellow-600 hover:bg-yellow-500 font-bold transition-all";
  }
}

// Indicador de conexión ESP32
function setConnectionState(isOnline) {
  const espBadge = document.getElementById("espStatusBadge");
  espBadge.innerText = isOnline ? "ONLINE" : "OFFLINE";
  espBadge.className = isOnline ? "text-emerald-400 font-bold" : "text-red-400 font-bold";
}

// Pedir el JSON a la ESP32
async function leerESP32() {
  try {
    const respuesta = await fetch(ESP32_IP + "/datos", { signal: AbortSignal.timeout(3000) });
    if(!respuesta.ok) throw new Error("Fallo en la red");
    
    const datos = await respuesta.json();
    
    // Aquí está la magia: conectamos los datos del DHT22 (tempAmbiente y humAmbiente) al Dashboard
    updateDashboard(
      datos.humedadSuelo,
      datos.tempAmbiente,
      datos.humAmbiente,
      datos.bomba,
      datos.modo 
    );
    
    setConnectionState(true);
    
  } catch(error) {
    console.log("No se pudo leer la ESP32:", error);
    setConnectionState(false);
  }
}

// Reloj y actualización periódica
setInterval(() => {
  const hora = new Date();
  document.getElementById("clock").innerText = hora.toLocaleTimeString();
}, 1000);

leerESP32();
setInterval(leerESP32, 2000); // Pide datos cada 2 segundos

</script>
</body>
</html>
